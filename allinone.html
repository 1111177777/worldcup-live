function wp(e1,e2){return 1/(1+Math.pow(10,-(e1-e2)/400))}
function poisson(l,k){let p=1;for(let i=1;i<=k;i++)p*=l/i;return Math.exp(-l)*p}
function pred(t1,t2){
    let e1=E[t1]||1600,e2=E[t2]||1600,adv=20;
    let xh=Math.max(0.5,1.4+(e1-e2+adv)/400*0.3),xa=Math.max(0.5,1.1-(e1-e2+adv)/400*0.3);
    let w=0,dr=0,lo=0,sc={};
    for(let i=0;i<8;i++)for(let j=0;j<8;j++){
        let p=poisson(xh,i)*poisson(xa,j);sc[i+':'+j]=p;
        if(i>j)w+=p*0.85;else if(i==j)dr+=p*1.3;else lo+=p*0.85;
    }
    let t=w+dr+lo;w=w/t*100;dr=dr/t*100;lo=lo/t*100;
    let top=Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,3);
    let gl={};for(let i=0;i<8;i++)for(let j=0;j<8;j++){let k=i+j;gl[k]=(gl[k]||0)+poisson(xh,i)*poisson(xa,j);}
    let gtop=Object.entries(gl).sort((a,b)=>b[1]-a[1]).slice(0,5);
    return{win:Math.round(w),draw:Math.round(dr),loss:Math.round(lo),tg:Math.round((xh+xa)*10)/10,top,goals:gtop};
}
function scorePick(t1,t2){
    let d=(E[t1]||1600)-(E[t2]||1600);
    if(d>=150)return["2:0/2:1/3:1",7.5,"强弱"];
    if(d<=-150)return["0:2/1:2/1:3",7.5,"强弱"];
    if(d>=50)return["2:1/1:1/1:0",7.0,"中距"];
    if(d<=-50)return["1:2/1:1/0:1",7.0,"中距"];
    return["1:1/0:0/1:0",6.0,"均势"];
}
function matchCard(num,t1,t2,date){
    let p=pred(t1,t2),[sc,sco,stag]=scorePick(t1,t2);
    let diff=(E[t1]||1600)-(E[t2]||1600);
    let glist=p.goals.map(([k,v])=>k+'球:'+Math.round(v*100)/100+'%').join(' | ');

}

// 5. Score cards
h+='<div class="sec" id="scores"><div class="sec-t" style="background:#555">🎯 比分推演卡片</div><div class="sec-b"><div class="sc-grid">';
R32.slice(8,16).forEach(([num,t1,t2])=>{let[sc,sco,stag]=scorePick(t1,t2);let tc=stag=='强弱'?'hi':(stag=='中距'?'md':'lo');h+='<div class="sc-c"><div class="sct '+tc+'">'+stag+'</div><div class="sctm">'+t1.slice(0,3)+'vs'+t2.slice(0,3)+'</div><div class="scts">'+sc+'</div><div style="font-size:9px;color:#1976d2">x'+sco+'</div></div>';});
h+='</div></div></div>';

// 6. Combos
let sortedM=R32.slice().sort((a,b)=>Math.abs((E[b[1]]||1600)-(E[b[2]]||1600))-Math.abs((E[a[1]]||1600)-(E[a[2]]||1600)));
h+='<div class="sec" id="combos"><div class="sec-t">🔗 淘汰赛逻辑组合</div><div class="sec-b">';
let comboNames=['2串1·双深盘组合','2串1·锚定+探索','3串1·三场联合','3串2·容错方案','4串2·四场容错','比分3串2·博冷'];
comboNames.forEach((cn,i)=>{let m1=sortedM[i%16],m2=sortedM[(i+1)%16],m3=sortedM[(i+2)%16];let t1=m1[1],t2=m1[2],t3=m2[1],t4=m2[2];h+='<div class="combo"><span class="cl">'+cn+'</span><br><span class="clg">'+(F[t1]||'')+t1+' vs '+(F[t2]||'')+t2+' + '+(F[t3]||'')+t3+' vs '+(F[t4]||'')+t4+'</span><br><span style="font-size:10px;color:#999">淘汰赛Poisson推演组合</span></div>';});
h+='</div></div>';

// 7. R16 → Final
function winner(t1,t2){let e1=E[t1]||1600,e2=E[t2]||1600;return wp(e1,e2)>0.5?t1:t2;}
let r32w=R32.map(([n,t1,t2])=>winner(t1,t2));
let R16=[[89,r32w[0],r32w[1]],[90,r32w[2],r32w[3]],[91,r32w[4],r32w[5]],[92,r32w[6],r32w[7]],[93,r32w[8],r32w[9]],[94,r32w[10],r32w[11]],[95,r32w[12],r32w[13]],[96,r32w[14],r32w[15]]];
let r16w=R16.map(([n,t1,t2])=>winner(t1,t2));
let QF=[[97,r16w[0],r16w[1]],[98,r16w[2],r16w[3]],[99,r16w[4],r16w[5]],[100,r16w[6],r16w[7]]];
let qfw=QF.map(([n,t1,t2])=>winner(t1,t2));
let SF=[[101,qfw[0],qfw[1]],[102,qfw[2],qfw[3]]];
let sfw=SF.map(([n,t1,t2])=>winner(t1,t2));
let FINAL=[[103,sfw[0],sfw[1]]];

h+='<div class="sec" id="r16final"><div class="sec-t">🏆 16强→决赛推演 <span class="badge">Elo连续推演</span></div><div class="sec-b">';
R16.forEach(([n,t1,t2])=>{h+=matchCard(n,t1,t2,'7/4-7');});
QF.forEach(([n,t1,t2])=>{h+=matchCard(n,t1,t2,'7/9-11');});
SF.forEach(([n,t1,t2])=>{h+=matchCard(n,t1,t2,'7/14-15');});
FINAL.forEach(([n,t1,t2])=>{h+='<div style="background:#fff3e0;padding:8px;border:2px solid #ffc107;border-radius:6px;margin:8px 0">'+matchCard(n,t1,t2,'🏆 7/19 纽约·决赛')+'</div>';});
h+='</div></div>';

// 8. Team analysis
h+='<div class="sec" id="teams"><div class="sec-t">⚽ 32强球队逐个分析</div><div class="sec-b">';
let allTeams=new Set();R32.forEach(([n,t1,t2])=>{allTeams.add(t1);allTeams.add(t2)});
[...allTeams].sort((a,b)=>(E[b]||1600)-(E[a]||1600)).forEach(t=>{
    let e=E[t]||1600,opp=null;R32.forEach(([n,t1,t2])=>{if(t1==t){opp=t2}else if(t2==t){opp=t1}});
    if(!opp)return;let eo=E[opp]||1600,diff=e-eo,pw=Math.round(wp(e,eo)*100);
    let tier=Math.abs(diff)>=200?'碾压':(Math.abs(diff)>=100?'优势':(Math.abs(diff)>=30?'接近':'均势'));
    h+='<div class="match"><div class="teams">'+(F[t]||'')+' '+t+' <span style="font-size:11px;color:#999">vs</span> '+(F[opp]||'')+' '+opp+'</div><div class="info"><b>Elo</b> '+e+' vs '+eo+' ('+tier+') · R32胜率 <b>'+pw+'%</b> · 预测晋级16强概率 <b>'+pw+'%</b></div></div>';
});
h+='</div></div>';

// 9. Style profiles
h+='<div class="sec" id="styles"><div class="sec-t" style="background:#1a237e">📋 32强球队风格档案</div><div class="sec-b">';
[...allTeams].sort((a,b)=>(E[b]||1600)-(E[a]||1600)).forEach(t=>{
    let s=STYLES[t]||'暂无数据';let e=E[t]||1600;
    h+='<div class="match"><div class="teams">'+(F[t]||'')+' '+t+' <span style="font-size:10px;color:#999">Elo '+e+'</span></div><div class="info">'+s+'</div></div>';
});
h+='</div></div>';

document.getElementById('content').innerHTML=h;
</script>
</body></html>
