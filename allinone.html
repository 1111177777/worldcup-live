const F={"阿根廷":"🇦🇷","法国":"🇫🇷","巴西":"🇧🇷","英格兰":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","西班牙":"🇪🇸","葡萄牙":"🇵🇹","德国":"🇩🇪","荷兰":"🇳🇱","乌拉圭":"🇺🇾","克罗地亚":"🇭🇷","哥伦比亚":"🇨🇴","摩洛哥":"🇲🇦","美国":"🇺🇸","墨西哥":"🇲🇽","塞内加尔":"🇸🇳","日本":"🇯🇵","韩国":"🇰🇷","埃及":"🇪🇬","比利时":"🇧🇪","瑞典":"🇸🇪","挪威":"🇳🇴","瑞士":"🇨🇭","奥地利":"🇦🇹","科特迪瓦":"🇨🇮","南非":"🇿🇦","加拿大":"🇨🇦","波黑":"🇧🇦","阿尔及利亚":"🇩🇿","厄瓜多尔":"🇪🇨","加纳":"🇬🇭","澳大利亚":"🇦🇺","刚果民主共和国":"🇨🇩"};
const S={"阿根廷":"4-4-2铁血防反·梅西驱动·中场绞杀","法国":"4-2-3-1高速反击·姆巴佩爆点·双后腰锁中路","巴西":"4-3-3桑巴传控·维尼修斯+罗德里戈双边爆破","英格兰":"4-2-3-1边路冲击·凯恩回撤·萨卡福登两翼","西班牙":"4-3-3Tiki-Taka控球65%+·罗德里调度·短传渗透","德国":"4-1-3-2纵向高压·维尔茨+穆夏拉双前腰","葡萄牙":"4-3-3巨星驱动·B费组织·莱奥爆破·C罗抢点","荷兰":"3-4-3全攻全守·双翼卫狂飙·德容控节奏","比利时":"4-2-3-1天才冲击·德布劳内长传·多库爆破","克罗地亚":"4-3-3中场磨盘·魔笛控节奏·擅长加时","哥伦比亚":"4-3-3边路冲击·迪亚斯突破·节奏飞快","摩洛哥":"4-3-3低位防反·阿什拉夫冲击·全员绞杀","美国":"4-3-3青春跑轰·普利西奇驱动·全压不停","墨西哥":"4-3-3技术流传控·边路突破·定位球丰富","瑞士":"4-3-3均衡务实·中后场流畅·射门转化率低","奥地利":"4-2-3-1红牛高位压迫·全场逼抢·跑动欧洲顶级","挪威":"4-3-3哈兰德支点·厄德高组织·边路传中","瑞典":"4-4-2北欧力量·身体对抗·定位球轰炸","日本":"4-2-3-1传控天花板·精细短传·逼抢轮转整齐","韩国":"4-2-3-1跑轰足球·极限体能·孙兴慜边路反击","埃及":"4-2-3-1萨拉赫单核·蹲坑防反·萨拉赫被锁=哑火","乌拉圭":"3-5-2铁血防守·三中卫死守·努涅斯支点","厄瓜多尔":"4-2-3-1高原跑动·全员压迫·边路二过一","塞内加尔":"4-3-3力量速度·边路爆破·身体碾压","加纳":"4-2-3-1硬朗足球·中场绞杀·威廉姆斯冲刺","科特迪瓦":"4-3-3个人驱动·边锋硬解·天赋出众","加拿大":"4-3-3青春风暴·戴维+布坎南飞驰·跑动惊人","南非":"4-2-3-1力量防反·中场硬度·反击威胁大","澳大利亚":"4-2-3-1澳式硬朗·高空传中·中场拼抢凶狠","波黑":"4-2-3-1低位收缩·克制控球队·进攻依赖单点","阿尔及利亚":"4-3-3北非技术流·马赫雷斯内切·配合细腻","刚果民主共和国":"4-4-2力量防反·全员退守·长传拼速度"};
const VENUES={73:{city:"洛杉矶",venue:"SoFi体育场",alt:38,heat:"理想",note:"地中海气候·有顶棚·比赛条件最佳"},74:{city:"波士顿",venue:"吉列体育场",alt:88,heat:"温和",note:"东北部凉爽·无顶棚·6月底舒适"},75:{city:"蒙特雷",venue:"BBVA体育场",alt:515,heat:"🔥高温",note:"半干旱高温WBGT≥30°C·无顶棚"},76:{city:"休斯顿",venue:"NRG体育场",alt:13,heat:"🔥极端",note:"全美最湿热·WBGT≥35°C·有顶棚可控"},77:{city:"纽约",venue:"大都会人寿",alt:2,heat:"温和",note:"决赛场地·7月中旬温度适宜"},78:{city:"达拉斯",venue:"AT&T体育场",alt:185,heat:"🔥高温",note:"可关顶棚·室外高温影响赛前热身"},79:{city:"墨西哥城",venue:"阿兹台克",alt:2240,heat:"🏔️高原",note:"海拔2240m!进球+33%·远射威胁大增·小球禁用"},80:{city:"亚特兰大",venue:"梅赛德斯-奔驰",alt:320,heat:"🌡️高温",note:"有顶棚可控·但6月底室外湿热"},81:{city:"旧金山",venue:"Levi's球场",alt:5,heat:"理想",note:"加州夏季干燥凉爽·最佳比赛条件"},82:{city:"西雅图",venue:"流明体育场",alt:50,heat:"理想",note:"最凉爽场地之一·高跑动比赛首选"},83:{city:"多伦多",venue:"BMO体育场",alt:76,heat:"温和",note:"加拿大凉爽·草皮可能偏软"},84:{city:"洛杉矶",venue:"SoFi体育场",alt:38,heat:"理想",note:"地中海气候·有顶棚·比赛条件最佳"},85:{city:"温哥华",venue:"BC Place",alt:3,heat:"理想",note:"最凉爽·可关顶棚·接近欧洲条件"},86:{city:"迈阿密",venue:"硬石体育场",alt:2,heat:"🔥极端",note:"高温+高湿·WBGT≥34°C·无顶棚·进球预期-8%"},87:{city:"堪萨斯城",venue:"箭头体育场",alt:278,heat:"🌡️高温",note:"无顶棚·夏季高温·露天热应力明显"},88:{city:"达拉斯",venue:"AT&T体育场",alt:185,heat:"🔥高温",note:"可关顶棚·室外高温影响赛前热身"}};
function wp(e1,e2){return 1/(1+Math.pow(10,-(e1-e2)/400))}
function poisson(l,k){let p=1;for(let i=1;i<=k;i++)p*=l/i;return Math.exp(-l)*p}

function genCard(num,t1,t2,date){
    let e1=E[t1]||1600,e2=E[t2]||1600,diff=e1-e2,adv=20;
    let xh=Math.max(0.5,1.4+(e1-e2+adv)/400*0.3),xa=Math.max(0.5,1.1-(e1-e2+adv)/400*0.3);
    let w=0,dr=0,lo=0;
    for(let i=0;i<8;i++)for(let j=0;j<8;j++){let p=poisson(xh,i)*poisson(xa,j);if(i>j)w+=p*0.85;else if(i==j)dr+=p*1.3;else lo+=p*0.85;}
    let t=w+dr+lo;w=w/t*100;dr=dr/t*100;lo=lo/t*100;
    let v=VENUES[num]||{city:"待定",venue:"待定",alt:0,heat:"?",note:""};
    // Altitude adjustment
    let adjG=Math.round((2.49*(1+0.00015*v.alt))*10)/10;
    if(v.heat.includes('极端'))adjG=Math.round(adjG*0.92*10)/10;
    else if(v.heat.includes('高温'))adjG=Math.round(adjG*0.95*10)/10;
    // Score pick
    let sc,sco;if(diff>=150){sc='2:0/2:1/3:1';sco=7.5}else if(diff<=-150){sc='0:2/1:2/1:3';sco=7.5}else if(diff>=50){sc='2:1/1:1/1:0';sco=7.0}else if(diff<=-50){sc='1:2/1:1/0:1';sco=7.0}else{sc='1:1/0:0/1:0';sco=6.0}
    let fav=diff>0?t1:t2,favPct=Math.round(wp(e1,e2)*100);
    let altWarn=v.alt>=2000?' ⚠️高原!进球+'+Math.round((adjG/2.49-1)*100)+'%':'';
    let heatWarn=v.heat.includes('极端')?' ⚠️高温压制进球-8%':(v.heat.includes('高温')?' ⚠️热应力进球-5%':'');

    return '<div class="match"><div class="match-header"><div class="mh-left"><span class="mnum">#'+num+'</span><span class="mround">32强 · '+date+'</span></div></div>'+
    '<div class="mvenue">📍 <b>'+v.city+'</b> · '+v.venue+' · 海拔<b class="malt">'+v.alt+'m</b> · '+v.heat+' · 预期进球 <b>'+adjG+'</b>球'+altWarn+heatWarn+'</div>'+
    '<div class="mvenue" style="font-size:10px;color:#888">💡 '+v.note+'</div>'+
    '<div class="teams">'+(F[t1]||'')+' '+t1+' <span class="vs">vs</span> '+(F[t2]||'')+' '+t2+'</div>'+
    '<div class="team-row"><span class="tname">'+(F[t1]||'')+' '+t1+'</span><span class="telo">Elo '+e1+'</span><span class="tstyle">'+(S[t1]||'')+'</span></div>'+
    '<div class="team-row"><span class="tname">'+(F[t2]||'')+' '+t2+'</span><span class="telo">Elo '+e2+'</span><span class="tstyle">'+(S[t2]||'')+'</span></div>'+
    '<div class="bar"><span class="lbl">'+t1.slice(0,3)+'</span><div class="track"><div class="fill" style="width:'+Math.round(w)+'%;background:#4caf50"></div></div><span class="pct">'+Math.round(w)+'%</span></div>'+
    '<div class="bar"><span class="lbl">平局</span><div class="track"><div class="fill" style="width:'+Math.round(dr)+'%;background:#ffc107"></div></div><span class="pct">'+Math.round(dr)+'%</span></div>'+
    '<div class="bar"><span class="lbl">'+t2.slice(0,3)+'</span><div class="track"><div class="fill" style="width:'+Math.round(lo)+'%;background:#f44336"></div></div><span class="pct">'+Math.round(lo)+'%</span></div>'+
    '<div class="info-row"><span class="info-tag it-elo">Elo差'+diff+' · '+fav+'占优'+favPct+'%</span><span class="info-tag it-goals">预期总进球 '+adjG+'球</span><span class="info-tag it-score">比分 '+sc+' x'+sco+'</span>'+((v.alt>=2000||v.heat.includes('极端'))?'<span class="info-tag it-venue">'+v.heat+'场地</span>':'')+'</div>'+
    '</div>';
}

const W={A:'墨西哥',B:'瑞士',C:'巴西',D:'美国',E:'德国',F:'荷兰',G:'埃及',H:'西班牙',I:'法国',J:'阿根廷',K:'哥伦比亚',L:'英格兰'};
const R={A:'南非',B:'加拿大',C:'摩洛哥',D:'澳大利亚',E:'科特迪瓦',F:'日本',G:'比利时',H:'乌拉圭',I:'挪威',J:'奥地利',K:'葡萄牙',L:'克罗地亚'};
const T3=['刚果民主共和国','瑞典','波黑','阿尔及利亚','塞内加尔','厄瓜多尔','加纳','韩国'];
const R32=[[73,R.A,R.B,'6/28'],[74,W.E,T3[0],'6/29'],[75,W.F,R.C,'6/29'],[76,W.C,R.F,'6/30'],[77,W.I,T3[1],'6/30'],[78,R.E,R.I,'6/30'],[79,W.A,T3[2],'7/1'],[80,W.L,T3[3],'7/1'],[81,W.D,T3[4],'7/1'],[82,W.G,T3[5],'7/2'],[83,R.K,R.L,'7/2'],[84,W.H,R.J,'7/2'],[85,W.B,T3[6],'7/3'],[86,W.J,R.H,'7/3'],[87,W.K,T3[7],'7/3'],[88,R.D,R.G,'7/3']];

let h='';
R32.forEach(([n,t1,t2,d])=>{h+=genCard(n,t1,t2,d);});
document.getElementById('content').innerHTML=h;
</script>
