name: Auto Update Scores & Deploy
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch scores & regenerate
        run: python fetch_espn.py

      - name: Commit and push
        run: |
          git config user.name "Bot"
          git config user.email "bot@auto.update"
          git add live.html schedule.json calibrate.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "🔄 auto update" && git push)
