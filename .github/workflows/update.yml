name: 自动更新世界杯数据

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install akshare matplotlib

      - name: 运行数据更新
        run: python live_data.py

      - name: 推送更新
        run: |
          git config user.name "Bot"
          git config user.email "bot@github.com"
          git add live.html schedule.json calibrate.json dashboard.html
          git diff --staged --quiet || git commit -m "自动更新"
          git push origin gh-pages
