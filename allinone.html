function poisson(l,k){let p=1;for(let i=1;i<=k;i++)p*=l/i;return Math.exp(-l)*p}
function wp(e1,e2){return 1/(1+Math.pow(10,-(e1-e2)/400))}

    let xh=Math.max(0.3,1.4+(e1-e2+20)/400*0.3),xa=Math.max(0.3,1.1-(e1-e2+20)/400*0.3);

    for(let i=0;i<8;i++)for(let j=0;j<8;j++){
        let p=poisson(xh,i)*poisson(xa,j);sc[i+':'+j]=p;let k=i+j;gl[k]=(gl[k]||0)+p;
        if(i>j)w+=p*0.85;else if(i==j)dr+=p*1.3;else lo+=p*0.85;

    else kb=fav+'整体优势 vs 对手短板';

    else if(Math.abs(diff)<50)xf='实力极度接近·加时/点球概率最高·任意一方先进球将主导节奏';
    else xf=fav+'整体占优·但淘汰赛一场定胜负·任何失误都可能致命';

    return{w,dr,lo,diff,fav,favP,tops,gdist,scs,sco,adjG,vn:v.vn,city:v.c,alt:v.alt,heat:v.heat,note:v.note,adjG,s1,s2,matchup,kb,xf,etP};
}

function card(num,t1,t2,date){
