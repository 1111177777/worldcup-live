name: Auto Update Scores & Deploy
on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Fetch live scores from ESPN
        run: python fetch_espn.py

      - name: Generate live.html
        run: python live_data.py

      - name: Commit and push
        run: |
          git config user.name "Bot"
          git config user.email "bot@auto.update"
          git add live.html schedule.json
          git diff --staged --quiet || (git commit -m "🔄 自动更新比分" && git push)
