<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>世界杯实时分析</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;background:#fff;display:flex;justify-content:center;padding:10px}
.card{width:750px;border:1px solid #e5e5e5;padding:0}
.hero{background:#111;color:#fff;padding:24px 20px;text-align:center}
.hero h1{font-size:20px;margin-bottom:4px}
.hero .sub{font-size:12px;color:#999}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#eee}
.feat{background:#fff;padding:14px 16px;display:flex;align-items:flex-start;gap:10px}
.feat .icon{font-size:18px;min-width:24px}
.feat .t{font-size:13px;font-weight:600;color:#111}
.feat .d{font-size:11px;color:#999;margin-top:2px}
.preview{background:#fafafa;padding:16px;border-top:1px solid #eee;text-align:center}
.preview .bar-line{display:flex;align-items:center;gap:8px;margin:4px auto;max-width:300px}
.preview .bar-line .l{width:28px;font-size:11px;color:#666;text-align:right}
.preview .bar-line .track{flex:1;height:6px;background:#eee}
.preview .bar-line .track i{display:block;height:6px;background:#111}
.preview .bar-line .n{width:36px;font-size:11px;text-align:right;font-weight:600}
.preview .tag{font-size:10px;color:#999;margin-top:8px}
.price-bar{background:#111;color:#fff;text-align:center;padding:14px;display:flex;justify-content:center;align-items:center;gap:12px}
.price-bar .big{font-size:24px;font-weight:bold}
.price-bar .note{font-size:11px;color:#999}
</style></head><body>
<div class="card">
<div class="hero">
<h1>🏆 2026世界杯 · 实时数据分析</h1>
<div class="sub">ELO模型 + 泊松分布 · 72场全预测 · 手机浏览器直接看</div>
</div>
<div class="grid">
<div class="feat"><span class="icon">🎯</span><div><div class="t">胜负概率</div><div class="d">三条概率条，一眼看懂谁赢面大</div></div></div>
<div class="feat"><span class="icon">⚡</span><div><div class="t">比分TOP5</div><div class="d">泊松模型推演最可能比分</div></div></div>
<div class="feat"><span class="icon">📊</span><div><div class="t">总进球分布</div><div class="d">0球到7+，每档精确百分比</div></div></div>
<div class="feat"><span class="icon">📰</span><div><div class="t">赛前情报</div><div class="d">伤病、战术、历史恩怨</div></div></div>
<div class="feat"><span class="icon">💰</span><div><div class="t">赔率对比</div><div class="d">市场赔率 vs 模型公允值</div></div></div>
<div class="feat"><span class="icon">🧠</span><div><div class="t">综合建议</div><div class="d">每场明确倾向+理由</div></div></div>
<div class="feat"><span class="icon">🔄</span><div><div class="t">持续更新</div><div class="d">赛程赛果自动同步，永久有效</div></div></div>
<div class="feat"><span class="icon">📱</span><div><div class="t">全设备通用</div><div class="d">手机平板电脑，浏览器即开即用</div></div></div>
</div>
<div class="preview">
<div class="bar-line"><span class="l">主胜</span><div class="track"><i style="width:57%"></i></div><span class="n">56.7%</span></div>
<div class="bar-line"><span class="l">平局</span><div class="track"><i style="width:23%;background:#888"></i></div><span class="n">22.6%</span></div>
<div class="bar-line"><span class="l">客胜</span><div class="track"><i style="width:20%;background:#ccc"></i></div><span class="n">20.4%</span></div>
<div class="tag">▲ 墨西哥 vs 南非 分析示例</div>
</div>
<div class="price-bar">
<div class="note">永久有效</div>
<div class="big">¥29.9</div>
<div class="note">整个世界杯</div>
</div>
</div>
</body></html>
