name: Update Match Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 防止挂死
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests akshare matplotlib

      - name: Setup GH token
        run: echo '${{ secrets.GH_TOKEN }}' > .env
        continue-on-error: true  # token可选，不影响主流程

      - name: Fetch scores & regenerate
        run: |
          echo "🏟 开始抓取比分..."
          python fetch_espn.py
          echo "✅ 抓取+生成完成"

      - name: Commit and push
        run: |
          git config user.name "wc-bot"
          git config user.email "bot@wc.live"
          git add live.html dashboard.html dashboard.json schedule.json calibrate.json chat_history.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "auto: $(TZ='Asia/Shanghai' date +'%m/%d %H:%M')" && git push)
