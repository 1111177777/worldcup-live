name: Auto Update Live Data
on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟
  workflow_dispatch:  # 手动也可以触发
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate live.html
        run: python live_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "Bot"
          git config user.email "bot@auto.update"
          git add live.html
          git diff --staged --quiet || (git commit -m "🔄 自动更新" && git push)
