name: Update Match Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install akshare matplotlib

      - name: Setup token
        run: echo '${{ secrets.GH_TOKEN }}' > .env

      - name: Run live_data
        run: python live_data.py

      - name: Push changes
        run: |
          git config user.name "wc-bot"
          git config user.email "bot@wc.live"
          git add live.html dashboard.html dashboard.json schedule.json calibrate.json chat_history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: $(TZ='Asia/Shanghai' date +'%m/%d %H:%M')"
          git push
